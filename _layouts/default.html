<!DOCTYPE html>
<html>  
  <!-- set title and get the style sheet -->
  <head>
    <title>{{ site.title }} | {{ page.title }}</title>
    <link rel="stylesheet" href="{{ "/resources/webdesign.css" | base_url}}">
  </head>

  <!-- Create website header with profile pic between firt and last name -->
  <header>
    <h1>
       Akelas
      <img src="{{ "/resources/neocities.png" | base_url }}" 
          width="25" 
          height="25" 
          alt=" Place holder for profile photo">
        Maestro
    </h1>
  </header>

  <!-- Generate the list of navigation links -->
  <nav>
    <ul>
      {% for link in site.data.navigation %}
      <li><a href="{{ link.url }}">{{ link.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>

  <!-- Insert content from pages and posts -->
    {{ content }}

  <!-- At some point, we need to add a footer here -->
    <p>
    Contact: contactAkelas (at) proton.me
    </p>
    <p>
    Copyright (c) 2026 Akelas Maestro. All Rights Reserved.
    </p>
</html>
